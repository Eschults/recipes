name: Ajouter une recette
description: Coller le lien d'une publication Instagram pour en tirer une recette au format RecipeMD.
title: "Ajouter une recette : "
labels: ["add-recipe"]
body:
  - type: markdown
    attributes:
      value: |
        Coller le lien de la publication. La légende et le compte sont lus directement sur Instagram ; le texte promotionnel, les hashtags et les mentions sont retirés automatiquement.

        Une pull request est ouverte avec la recette. Rien n'est ajouté à la collection avant qu'elle soit relue et fusionnée.

  - type: input
    id: url
    attributes:
      label: Source URL
      description: "Le lien vers la publication. Les paramètres de suivi sont retirés."
      placeholder: https://www.instagram.com/reel/XXXXXXXXXXX/
    validations:
      required: true
