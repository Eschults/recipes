name: Validate RecipeMD
description: >-
  Check recipes against the reference RecipeMD parser, the Python `recipemd`
  package. Used both by the workflow that guards the collection and by the one
  that writes a new recipe, so the two cannot drift apart.

inputs:
  path:
    description: >-
      A single recipe to check. Defaults to every recipes/**/recipe.md in the
      checkout.
    required: false
    default: ''

runs:
  using: composite

  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install RecipeMD
      shell: bash
      run: python -m pip install --upgrade pip recipemd

    - name: Validate
      shell: bash
      env:
        RECIPE_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        status=0

        list_recipes() {
          if [ -n "$RECIPE_PATH" ]; then
            printf '%s\0' "$RECIPE_PATH"
          else
            find recipes -type f -path '*/recipe.md' -print0
          fi
        }

        while IFS= read -r -d '' file; do
          echo "::group::Validating ${file}"

          if python "$GITHUB_ACTION_PATH/validate.py" "$file"; then
            echo "OK"
          else
            status=1
          fi

          echo "::endgroup::"
        done < <(list_recipes)

        exit "$status"
