name: Add a recipe from a caption

# `labeled` only, never `opened`: the issue form applies the label as it
# creates the issue, so listening for both ran everything twice. Labelling by
# hand afterwards is also a valid way in, and this covers it.
#
# workflow_dispatch takes the same single field as the issue form, for
# running this from the command line or the Actions tab.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      url:
        description: Link to the original post
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: add-recipe-${{ github.event.issue.number || github.run_id }}

jobs:
  add-recipe:
    name: Write the recipe and open a pull request
    # Every run costs money, so the issue author has to be someone with write
    # access. Without this the gate is incidental rather than chosen: it holds
    # only for as long as the issue form declines to label a stranger's issue,
    # which is not a promise GitHub makes. workflow_dispatch needs no check of
    # its own, since running a workflow by hand already requires write access.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'add-recipe' &&
       contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest

    steps:
      - name: Check out the recipes
        uses: actions/checkout@v4

      # The RecipeMD parser is the cookbook's, so that a recipe accepted here
      # is one the cookbook can actually read.
      - name: Check out the cookbook
        uses: actions/checkout@v4
        with:
          repository: Eschults/cookbook
          path: cookbook

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Only Chromium is used; the next step fetches just that one, with
          # the system libraries it needs to actually launch headless.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The issue body is untrusted input, so it reaches the script through a
      # file and an environment variable, never through the shell.
      - name: Assemble the request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '### Source URL\n\n%s\n' "$INPUT_URL" > request.md
          else
            printf '%s' "$ISSUE_BODY" > request.md
          fi

      - name: Write the recipe
        id: recipe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COOKBOOK_DIR: ${{ github.workspace }}/cookbook
        run: npm run add-recipe -- --body-file request.md

      # validate.yml does get a run on the pull request this job opens, but
      # that run is created and then held until a human approves it, so it is
      # not an automatic gate. This is, and running it before the pull request
      # exists means a recipe that does not parse fails the run instead of
      # becoming a pull request to clean up. It is the same action validate.yml
      # uses, so the two checks cannot drift apart.
      - name: Validate with the reference parser
        uses: ./.github/actions/validate-recipemd
        with:
          path: ${{ steps.recipe.outputs.path }}

      - name: Open a pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.recipe.outputs.slug }}
          TITLE: ${{ steps.recipe.outputs.title }}
          RECIPE_PATH: ${{ steps.recipe.outputs.path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "add-recipe/$SLUG"
          git add "$RECIPE_PATH"
          git commit -m "Ajouter $TITLE"
          git push --force --set-upstream origin "add-recipe/$SLUG"

          body="Recette écrite à partir d'une légende, à relire avant fusion."
          if [ -n "$ISSUE_NUMBER" ]; then
            body="$body

          Closes #$ISSUE_NUMBER"
          fi

          url=$(gh pr create --base main --head "add-recipe/$SLUG" --title "Ajouter $TITLE" --body "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link the pull request from the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Recette prête à relire : $PR_URL"

      - name: Report a failure on the issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "La recette n'a pas pu être écrite. Journal : $RUN_URL"
