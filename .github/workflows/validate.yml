name: Validate RecipeMD format

on:
  push:
    paths:
      - "recipes/**/recipe.md"
      - ".github/workflows/validate.yml"
      - ".github/actions/validate-recipemd/**"
  pull_request:
    paths:
      - "recipes/**/recipe.md"
      - ".github/workflows/validate.yml"
      - ".github/actions/validate-recipemd/**"

permissions:
  contents: read

jobs:
  validate:
    name: RecipeMD validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate every recipe
        uses: ./.github/actions/validate-recipemd
